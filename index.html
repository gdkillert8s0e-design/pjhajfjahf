<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сирис - AI Ассистент</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
            transition: background 0.5s ease;
        }

        /* Темы */
        body.light-theme {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body.dark-theme {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
        }

        body.sunset-theme {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        body.ocean-theme {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
        }

        body.forest-theme {
            background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);
        }

        /* Эффекты */
        .effects-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .snowflake, .leaf, .raindrop, .star, .bubble {
            position: absolute;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        /* Снежинки */
        .snowflake {
            color: white;
            font-size: 1.5em;
            opacity: 0.8;
            animation: fall 10s linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        /* Листья */
        .leaf {
            font-size: 2em;
            animation: leafFall 8s linear infinite;
        }

        @keyframes leafFall {
            to {
                transform: translateY(100vh) rotate(720deg) translateX(100px);
            }
        }

        /* Капли дождя */
        .raindrop {
            width: 2px;
            height: 20px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.8), transparent);
            animation: rain 1s linear infinite;
        }

        @keyframes rain {
            to {
                transform: translateY(100vh);
            }
        }

        /* Звезды */
        .star {
            color: gold;
            font-size: 1.2em;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Пузыри */
        .bubble {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.2));
            animation: bubbleRise 8s linear infinite;
        }

        @keyframes bubbleRise {
            to {
                transform: translateY(-100vh);
            }
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        body.dark-theme .container {
            background: rgba(30, 30, 40, 0.95);
            color: #e0e0e0;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
            position: relative;
        }

        body.dark-theme .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        body.sunset-theme .header {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        body.ocean-theme .header {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
        }

        body.forest-theme .header {
            background: linear-gradient(135deg, #134e5e 0%, #71b280 100%);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .theme-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .theme-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: transform 0.2s;
            font-weight: 600;
        }

        .theme-btn:hover {
            transform: scale(1.1);
        }

        .theme-btn.active {
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .theme-light { background: #667eea; color: white; }
        .theme-dark { background: #1a1a2e; color: white; }
        .theme-sunset { background: #fa709a; color: white; }
        .theme-ocean { background: #00c6ff; color: white; }
        .theme-forest { background: #134e5e; color: white; }

        .effects-selector {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .effect-btn {
            padding: 6px 12px;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 15px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
        }

        .effect-btn.active {
            background: white;
            color: #667eea;
        }

        body.dark-theme .effect-btn.active {
            color: #1a1a2e;
        }

        .chat-container {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        body.dark-theme .chat-container {
            background: #1a1a2a;
        }

        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            text-align: right;
        }

        .message-content {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        body.dark-theme .message.user .message-content {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
        }

        .message.bot .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        body.dark-theme .message.bot .message-content {
            background: #2d3748;
            color: #e0e0e0;
        }

        .message-header {
            font-size: 11px;
            margin-bottom: 5px;
            opacity: 0.7;
        }

        .input-container {
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        body.dark-theme .input-container {
            background: #2d3748;
            border-top: 1px solid #4a5568;
        }

        #messageInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
            background: white;
        }

        body.dark-theme #messageInput {
            background: #1a1a2a;
            border-color: #4a5568;
            color: #e0e0e0;
        }

        #messageInput:focus {
            border-color: #667eea;
        }

        #sendBtn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        body.dark-theme #sendBtn {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
        }

        #sendBtn:hover {
            transform: scale(1.05);
        }

        #sendBtn:active {
            transform: scale(0.95);
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: none;
            padding: 10px;
            text-align: left;
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        body.dark-theme .typing-dot {
            background: #666;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .stats {
            padding: 15px;
            background: #f9f9f9;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            font-size: 12px;
            color: #666;
        }

        body.dark-theme .stats {
            background: #1a1a2a;
            border-top: 1px solid #4a5568;
            color: #999;
        }

        .btn-clear {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 5px;
        }

        .btn-clear:hover {
            background: #ff3838;
        }
    </style>
</head>
<body class="light-theme">
    <!-- Контейнер для эффектов -->
    <div class="effects-container" id="effectsContainer"></div>

    <div class="container">
        <div class="header">
            <h1>🤖 Сирис</h1>
            <p>AI-ассистент на базе Groq (LLaMA 3.3 70B)</p>
            
            <div class="theme-selector">
                <button class="theme-btn theme-light active" onclick="setTheme('light')">☀️ Светлая</button>
                <button class="theme-btn theme-dark" onclick="setTheme('dark')">🌙 Тёмная</button>
                <button class="theme-btn theme-sunset" onclick="setTheme('sunset')">🌅 Закат</button>
                <button class="theme-btn theme-ocean" onclick="setTheme('ocean')">🌊 Океан</button>
                <button class="theme-btn theme-forest" onclick="setTheme('forest')">🌲 Лес</button>
            </div>

            <div class="effects-selector">
                <button class="effect-btn" onclick="toggleEffect('snow')">❄️ Снег</button>
                <button class="effect-btn" onclick="toggleEffect('leaves')">🍂 Листья</button>
                <button class="effect-btn" onclick="toggleEffect('rain')">🌧️ Дождь</button>
                <button class="effect-btn" onclick="toggleEffect('stars')">⭐ Звезды</button>
                <button class="effect-btn" onclick="toggleEffect('bubbles')">💧 Пузыри</button>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                <div class="message-header">🤖 Сирис</div>
                <div class="message-content">
                    Привет! 👋 Я Сирис - твой AI-ассистент. Задавай любые вопросы, и я с радостью помогу! 😊
                </div>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
        </div>

        <div class="input-container">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Напишите сообщение..."
                autocomplete="off"
            >
            <button id="sendBtn">Отправить</button>
        </div>

        <div class="stats">
            <div>Сообщений: <strong id="msgCount">1</strong></div>
            <button class="btn-clear" onclick="clearHistory()">Очистить историю</button>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "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";
        const GROQ_API_URL = "https://api.groq.com/openai/v1/chat/completions";
        const MODEL_NAME = "llama-3.3-70b-versatile";

        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let messages = [
            {
                role: "system",
                content: "Ты умный AI-ассистент по имени Сирис. Отвечай дружелюбно, помогай пользователям и поддерживай разговор. Используй emoji когда это уместно. Отвечай на русском языке."
            }
        ];

        let messageCount = 1;
        let currentEffect = null;

        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const msgCountEl = document.getElementById('msgCount');
        const effectsContainer = document.getElementById('effectsContainer');

        // Темы
        function setTheme(theme) {
            document.body.className = theme + '-theme';
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            localStorage.setItem('theme', theme);
        }

        // Эффекты
        function toggleEffect(effect) {
            const btn = event.target;
            
            if (currentEffect === effect) {
                // Выключаем эффект
                currentEffect = null;
                btn.classList.remove('active');
                stopEffect();
            } else {
                // Включаем новый эффект
                document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
                currentEffect = effect;
                btn.classList.add('active');
                stopEffect();
                startEffect(effect);
            }
            
            localStorage.setItem('effect', currentEffect || 'none');
        }

        function startEffect(effect) {
            const effects = {
                snow: createSnowflakes,
                leaves: createLeaves,
                rain: createRain,
                stars: createStars,
                bubbles: createBubbles
            };

            if (effects[effect]) {
                effects[effect]();
            }
        }

        function stopEffect() {
            effectsContainer.innerHTML = '';
        }

        function createSnowflakes() {
            setInterval(() => {
                if (currentEffect !== 'snow') return;
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                snowflake.textContent = '❄';
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.animationDuration = (Math.random() * 3 + 7) + 's';
                snowflake.style.opacity = Math.random();
                effectsContainer.appendChild(snowflake);
                setTimeout(() => snowflake.remove(), 10000);
            }, 200);
        }

        function createLeaves() {
            setInterval(() => {
                if (currentEffect !== 'leaves') return;
                const leaf = document.createElement('div');
                leaf.className = 'leaf';
                leaf.textContent = ['🍂', '🍁', '🍃'][Math.floor(Math.random() * 3)];
                leaf.style.left = Math.random() * 100 + '%';
                leaf.style.animationDuration = (Math.random() * 2 + 6) + 's';
                effectsContainer.appendChild(leaf);
                setTimeout(() => leaf.remove(), 8000);
            }, 300);
        }

        function createRain() {
            setInterval(() => {
                if (currentEffect !== 'rain') return;
                const drop = document.createElement('div');
                drop.className = 'raindrop';
                drop.style.left = Math.random() * 100 + '%';
                drop.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
                effectsContainer.appendChild(drop);
                setTimeout(() => drop.remove(), 1000);
            }, 50);
        }

        function createStars() {
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.textContent = '⭐';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                effectsContainer.appendChild(star);
            }
        }

        function createBubbles() {
            setInterval(() => {
                if (currentEffect !== 'bubbles') return;
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.style.left = Math.random() * 100 + '%';
                bubble.style.bottom = '-30px';
                bubble.style.animationDuration = (Math.random() * 4 + 4) + 's';
                effectsContainer.appendChild(bubble);
                setTimeout(() => bubble.remove(), 8000);
            }, 500);
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            messageInput.value = '';
            sendBtn.disabled = true;
            typingIndicator.classList.add('active');

            messages.push({
                role: "user",
                content: text
            });

            try {
                const response = await fetch(GROQ_API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GROQ_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: messages.slice(-11),
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const aiResponse = data.choices[0].message.content;

                messages.push({
                    role: "assistant",
                    content: aiResponse
                });

                typingIndicator.classList.remove('active');
                addMessage(aiResponse, 'bot');

            } catch (error) {
                console.error('Error:', error);
                typingIndicator.classList.remove('active');
                addMessage('Извините, произошла ошибка при обработке запроса 😔', 'bot');
            }

            sendBtn.disabled = false;
            messageInput.focus();
        }

        function addMessage(text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const header = document.createElement('div');
            header.className = 'message-header';
            header.textContent = type === 'user' ? '👤 Вы' : '🤖 Сирис';

            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;

            messageDiv.appendChild(header);
            messageDiv.appendChild(content);
            chatContainer.appendChild(messageDiv);

            chatContainer.scrollTop = chatContainer.scrollHeight;

            messageCount++;
            msgCountEl.textContent = messageCount;
        }

        function clearHistory() {
            if (confirm('Очистить всю историю разговора?')) {
                messages = [messages[0]];
                chatContainer.innerHTML = `
                    <div class="message bot">
                        <div class="message-header">🤖 Сирис</div>
                        <div class="message-content">
                            История очищена! Начнём сначала? 😊
                        </div>
                    </div>
                `;
                messageCount = 1;
                msgCountEl.textContent = messageCount;
            }
        }

        // События
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Telegram WebApp кнопка
        tg.MainButton.text = "Отправить";
        tg.MainButton.onClick(() => {
            sendMessage();
        });

        messageInput.addEventListener('input', () => {
            if (messageInput.value.trim()) {
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        });

        // Загрузка сохраненных настроек
        window.addEventListener('load', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            const savedEffect = localStorage.getItem('effect');
            
            document.body.className = savedTheme + '-theme';
            document.querySelectorAll('.theme-btn').forEach(btn => {
                if (btn.textContent.toLowerCase().includes(savedTheme)) {
                    btn.classList.add('active');
                }
            });

            if (savedEffect && savedEffect !== 'none') {
                currentEffect = savedEffect;
                document.querySelectorAll('.effect-btn').forEach(btn => {
                    if (btn.onclick.toString().includes(savedEffect)) {
                        btn.classList.add('active');
                    }
                });
                startEffect(savedEffect);
            }
        });
    </script>
</body>
</html>
