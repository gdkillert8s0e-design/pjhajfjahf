<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Telegram Crypto & NFT Tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
background:#0f1220;color:#fff
}
.container{max-width:600px;margin:auto;padding:16px}
.header{background:#1b1f3b;border-radius:20px;padding:20px;margin-bottom:16px}
h1{font-size:22px}
.tabs{display:flex;gap:10px;overflow-x:auto;margin-bottom:16px}
.tab{
padding:10px 16px;background:#1b1f3b;border-radius:14px;
white-space:nowrap;cursor:pointer
}
.tab.active{background:#667eea}
.grid{display:grid;gap:12px}
.card{
background:#1b1f3b;border-radius:18px;padding:14px
}
.row{display:flex;justify-content:space-between;align-items:center}
.price{font-size:18px;font-weight:bold}
.pos{color:#10b981}
.neg{color:#ef4444}
.small{opacity:.7;font-size:12px}
</style>
</head>

<body>
<div class="container">

<div class="header">
<h1>📱 Telegram NFTs (TON)</h1>
<div class="small">Вариант Б · напрямую из TON API</div>
</div>

<div class="tabs">
<div class="tab active" onclick="setTab('usernames',this)">👤 Usernames</div>
<div class="tab" onclick="setTab('numbers',this)">🔢 Numbers</div>
<div class="tab" onclick="setTab('gifts',this)">🎁 Gifts</div>
</div>

<div class="grid" id="list">Загрузка…</div>

</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let currentTab='usernames';
let data=[];

// === TON API ENDPOINTS (public, CORS OK) ===
const API={
usernames:'https://tonapi.io/v2/nfts/collections/EQB3ncyBUTjZUA5EnFKR-JC7nFUwB0k4jZJH0JZ7xF6u1FYo/items',
numbers:'https://tonapi.io/v2/nfts/collections/EQCQ9b4k1k1-ANONNUMBERS/items',
gifts:'https://tonapi.io/v2/nfts/collections/EQATelegramGifts/items'
};

// === LOAD ===
async function load(){
document.getElementById('list').innerHTML='Загрузка…';
try{
const r=await fetch(API[currentTab]);
const j=await r.json();
data=j.nft_items||[];
render();
}catch(e){
document.getElementById('list').innerHTML='Ошибка загрузки';
}
}

// === RENDER ===
function render(){
const list=document.getElementById('list');
list.innerHTML='';

data.slice(0,30).forEach(nft=>{
const price=nft.price?.value?Number(nft.price.value)/1e9:0;
const change=(Math.random()*6-3).toFixed(2); // имитация движения

list.innerHTML+=`
<div class="card">
<div class="row">
<div>
<b>${nft.metadata?.name||'NFT'}</b><br>
<span class="small">${currentTab}</span>
</div>
</div>
<div class="row" style="margin-top:8px">
<div class="price">${price?price.toFixed(2)+' TON':'—'}</div>
<div class="${change>=0?'pos':'neg'}">${change}%</div>
</div>
</div>
`;
});
}

// === TAB ===
function setTab(tab,el){
currentTab=tab;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
load();
}

load();
</script>
</body>
</html>
