<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Орёл и Решка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: white;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 30px;
            color: white;
            display: flex;
            justify-content: space-around;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 5px;
        }

        .coin-container {
            perspective: 1000px;
            margin: 40px 0;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .coin {
            width: 180px;
            height: 180px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s;
        }

        .coin.flipping {
            animation: flip 1s ease-in-out;
        }

        @keyframes flip {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(1800deg); }
        }

        .coin-side {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: absolute;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5em;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 5px solid #FFD700;
        }

        .heads {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            transform: rotateY(0deg);
        }

        .tails {
            background: linear-gradient(135deg, #C0C0C0 0%, #808080 100%);
            transform: rotateY(180deg);
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 18px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-heads {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #333;
        }

        .btn-tails {
            background: linear-gradient(135deg, #C0C0C0 0%, #808080 100%);
            color: white;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            font-size: 1.3em;
            font-weight: bold;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .result.show {
            opacity: 1;
        }

        .result.win {
            color: #10b981;
        }

        .result.lose {
            color: #ef4444;
        }

        .reset-btn {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 30px;
            font-size: 1em;
        }

        .streak {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            display: none;
        }

        .streak.show {
            display: block;
            animation: bounce 0.5s;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="streak" id="streak">🔥 Серия: <span id="streakCount">0</span></div>

    <div class="container">
        <h1>🪙 Орёл и Решка</h1>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Побед</div>
                <div class="stat-value" id="wins">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Поражений</div>
                <div class="stat-value" id="losses">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Всего</div>
                <div class="stat-value" id="total">0</div>
            </div>
        </div>

        <div class="coin-container">
            <div class="coin" id="coin">
                <div class="coin-side heads">🦅</div>
                <div class="coin-side tails">👑</div>
            </div>
        </div>

        <div class="buttons">
            <button class="btn-heads" id="headsBtn" onclick="makeChoice('heads')">
                🦅 Орёл
            </button>
            <button class="btn-tails" id="tailsBtn" onclick="makeChoice('tails')">
                👑 Решка
            </button>
        </div>

        <div class="result" id="result"></div>

        <button class="reset-btn" onclick="resetStats()">🔄 Сбросить статистику</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.hide();

        let stats = {
            wins: 0,
            losses: 0,
            total: 0,
            currentStreak: 0,
            bestStreak: 0
        };

        // Загрузка статистики
        function loadStats() {
            const saved = localStorage.getItem('coinFlipStats');
            if (saved) {
                stats = JSON.parse(saved);
                updateStatsDisplay();
            }
        }

        // Сохранение статистики
        function saveStats() {
            localStorage.setItem('coinFlipStats', JSON.stringify(stats));
        }

        // Обновление отображения статистики
        function updateStatsDisplay() {
            document.getElementById('wins').textContent = stats.wins;
            document.getElementById('losses').textContent = stats.losses;
            document.getElementById('total').textContent = stats.total;
            
            if (stats.currentStreak >= 3) {
                document.getElementById('streakCount').textContent = stats.currentStreak;
                document.getElementById('streak').classList.add('show');
            } else {
                document.getElementById('streak').classList.remove('show');
            }
        }

        // Основная функция выбора
        function makeChoice(userChoice) {
            const coin = document.getElementById('coin');
            const result = document.getElementById('result');
            const buttons = document.querySelectorAll('.buttons button');
            
            // Блокируем кнопки
            buttons.forEach(btn => btn.disabled = true);
            
            // Скрываем предыдущий результат
            result.classList.remove('show');
            
            // Случайный результат
            const coinResult = Math.random() < 0.5 ? 'heads' : 'tails';
            
            // Анимация броска
            coin.classList.add('flipping');
            
            setTimeout(() => {
                coin.classList.remove('flipping');
                
                // Поворачиваем монету к нужной стороне
                if (coinResult === 'tails') {
                    coin.style.transform = 'rotateY(180deg)';
                } else {
                    coin.style.transform = 'rotateY(0deg)';
                }
                
                // Показываем результат
                setTimeout(() => {
                    const win = userChoice === coinResult;
                    
                    stats.total++;
                    if (win) {
                        stats.wins++;
                        stats.currentStreak++;
                        if (stats.currentStreak > stats.bestStreak) {
                            stats.bestStreak = stats.currentStreak;
                        }
                        result.textContent = '🎉 Вы выиграли!';
                        result.className = 'result show win';
                        
                        // Вибрация при победе
                        if (tg.HapticFeedback) {
                            tg.HapticFeedback.notificationOccurred('success');
                        }
                    } else {
                        stats.losses++;
                        stats.currentStreak = 0;
                        result.textContent = '😢 Вы проиграли!';
                        result.className = 'result show lose';
                        
                        // Вибрация при поражении
                        if (tg.HapticFeedback) {
                            tg.HapticFeedback.notificationOccurred('error');
                        }
                    }
                    
                    const coinName = coinResult === 'heads' ? 'Орёл 🦅' : 'Решка 👑';
                    result.textContent += ` Выпало: ${coinName}`;
                    
                    updateStatsDisplay();
                    saveStats();
                    
                    // Разблокируем кнопки
                    buttons.forEach(btn => btn.disabled = false);
                }, 300);
                
            }, 1000);
        }

        // Сброс статистики
        function resetStats() {
            if (confirm('Вы уверены, что хотите сбросить статистику?')) {
                stats = {
                    wins: 0,
                    losses: 0,
                    total: 0,
                    currentStreak: 0,
                    bestStreak: 0
                };
                updateStatsDisplay();
                saveStats();
                document.getElementById('result').classList.remove('show');
                
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('warning');
                }
            }
        }

        // Инициализация
        loadStats();

        // Настройка темы Telegram
        if (tg.colorScheme === 'dark') {
            document.body.style.background = 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)';
        }
    </script>
</body>
</html>
