<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Crypto & NFT Tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f1220;
    color: #fff;
}
header {
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
}
.tabs {
    display: flex;
    gap: 10px;
    padding: 10px;
    overflow-x: auto;
}
.tab {
    padding: 10px 16px;
    background: #1b1f3b;
    border-radius: 12px;
    cursor: pointer;
    white-space: nowrap;
}
.tab.active {
    background: #667eea;
}
.list {
    padding: 15px;
}
.card {
    background: #1b1f3b;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 12px;
}
.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.price {
    font-size: 18px;
    font-weight: bold;
}
.pos { color: #10b981; }
.neg { color: #ef4444; }
</style>
</head>

<body>

<header>🚀 Crypto / NFT / Telegram</header>

<div class="tabs">
    <div class="tab active" onclick="setCat('all',this)">Все</div>
    <div class="tab" onclick="setCat('telegram',this)">📱 Telegram</div>
    <div class="tab" onclick="setCat('nft',this)">🎨 NFT</div>
    <div class="tab" onclick="setCat('meme',this)">🐸 Memes</div>
</div>

<div class="list" id="list">
Загрузка...
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let category = 'all';
let coins = [];

const GROUPS = {
    telegram: ['toncoin','notcoin','gram'],
    nft: ['apecoin','blur','looksrare','decentraland','the-sandbox'],
    meme: ['pepe','dogecoin','shiba-inu','floki']
};

async function loadMarket() {
    const url =
        'https://api.coingecko.com/api/v3/coins/markets' +
        '?vs_currency=usd' +
        '&order=market_cap_desc' +
        '&per_page=100' +
        '&page=1' +
        '&price_change_percentage=24h';

    const r = await fetch(url);
    const data = await r.json();

    coins = data.map(c => ({
        id: c.id,
        name: c.name,
        symbol: c.symbol.toUpperCase(),
        price: c.current_price,
        change: c.price_change_percentage_24h || 0,
        image: c.image
    }));

    render();
}

function render() {
    const list = document.getElementById('list');
    let data = coins;

    if (category !== 'all') {
        data = data.filter(c => GROUPS[category]?.includes(c.id));
    }

    list.innerHTML = '';

    data.forEach(c => {
        const cls = c.change >= 0 ? 'pos' : 'neg';
        const sign = c.change >= 0 ? '+' : '';

        list.innerHTML += `
        <div class="card">
            <div class="row">
                <div>
                    <b>${c.name}</b><br>
                    <small>${c.symbol}</small>
                </div>
                <img src="${c.image}" width="32">
            </div>
            <div class="row">
                <div class="price">$${c.price.toLocaleString()}</div>
                <div class="${cls}">${sign}${c.change.toFixed(2)}%</div>
            </div>
        </div>
        `;
    });
}

function setCat(cat, el) {
    category = cat;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    render();
}

loadMarket();
setInterval(loadMarket, 10000);
</script>

</body>
</html>
