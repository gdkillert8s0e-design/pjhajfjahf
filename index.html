<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Mini Game App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: 'Montserrat', Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .navbar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
      padding: 10px 0;
      position: fixed;
      bottom: 0;
      width: 100%;
      z-index: 10;
    }
    .navbar button {
      background: none;
      border: none;
      color: #fff;
      font-size: 16px;
      padding: 10px 20px;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .navbar button.active, .navbar button:hover {
      background: #222;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      background: #181828;
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-right: 10px;
    }
    .balance {
      background: #222;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .main {
      padding: 80px 16px 80px 16px;
      min-height: 100vh;
    }
    .game-card {
      background: #181828;
      border-radius: 18px;
      margin-bottom: 24px;
      padding: 24px;
      box-shadow: 0 2px 12px #0004;
      text-align: center;
      transition: box-shadow 0.2s;
    }
    .game-card h2 {
      margin: 0 0 12px 0;
      font-size: 22px;
      letter-spacing: 1px;
    }
    .btn {
      background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 24px;
      font-size: 16px;
      margin-top: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:active {
      background: #333;
    }
    /* Mines grid */
    .mines-grid {
      display: grid;
      grid-template-columns: repeat(5, 36px);
      gap: 8px;
      justify-content: center;
      margin: 16px 0;
    }
    .mines-cell {
      width: 36px;
      height: 36px;
      background: #222;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: background 0.2s;
      user-select: none;
    }
    .mines-cell.open {
      background: #6a11cb;
      color: #fff;
    }
    .mines-cell.bomb {
      background: #e74c3c;
      color: #fff;
    }
    /* Rocket */
    .rocket-img {
      width: 80px;
      margin: 16px 0;
      animation: rocket-fly 1.5s infinite alternate;
    }
    @keyframes rocket-fly {
      0% { transform: translateY(0);}
      100% { transform: translateY(-20px);}
    }
    /* Wheel */
    .wheel {
      margin: 0 auto 16px auto;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 8px solid #6a11cb;
      background: conic-gradient(
        #6a11cb 0% 20%, #2575fc 20% 40%, #e74c3c 40% 60%, #f1c40f 60% 80%, #2ecc71 80% 100%
      );
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .wheel-pointer {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-bottom: 24px solid #fff;
    }
    .wheel-label {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      font-size: 22px;
      color: #fff;
      font-weight: bold;
      text-shadow: 0 2px 8px #000a;
    }
    /* Hide all game screens by default */
    .game-screen { display: none; }
    .game-screen.active { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <div style="display:flex;align-items:center;">
      <div class="avatar">👾</div>
      <div>
        <div style="font-weight:600;font-size:18px;">DJARBIZ</div>
        <div style="font-size:12px;color:#aaa;">Уровень 1</div>
      </div>
    </div>
    <div class="balance">
      <span>🟣 12</span>
      <span>🟡 5</span>
    </div>
  </div>
  <div class="main">
    <!-- Игры -->
    <div id="games-list" class="game-screen active">
      <div class="game-card">
        <h2>💣 Мины</h2>
        <div>Открой клетки, не попав на мину!</div>
        <button class="btn" onclick="showGame('mines')">Играть</button>
      </div>
      <div class="game-card">
        <h2>🚀 Ракета</h2>
        <div>Успей забрать выигрыш до взрыва ракеты!</div>
        <button class="btn" onclick="showGame('rocket')">Играть</button>
      </div>
      <div class="game-card">
        <h2>🎡 Колесо</h2>
        <div>Крути колесо и получи приз!</div>
        <button class="btn" onclick="showGame('wheel')">Играть</button>
      </div>
    </div>
    <!-- Мины -->
    <div id="mines-game" class="game-screen">
      <button class="btn" onclick="showGame('games-list')">← Назад</button>
      <h2>💣 Мины</h2>
      <div class="mines-grid" id="mines-grid"></div>
      <div id="mines-status"></div>
      <button class="btn" onclick="startMines()">Сбросить</button>
    </div>
    <!-- Ракета -->
    <div id="rocket-game" class="game-screen">
      <button class="btn" onclick="showGame('games-list')">← Назад</button>
      <h2>🚀 Ракета</h2>
      <img src="https://cdn-icons-png.flaticon.com/512/3214/3214425.png" class="rocket-img" alt="Rocket">
      <div id="rocket-multiplier" style="font-size:32px;margin:12px 0;">x1.00</div>
      <button class="btn" id="rocket-cashout" onclick="cashoutRocket()" disabled>Забрать</button>
      <button class="btn" onclick="startRocket()">Старт</button>
    </div>
    <!-- Колесо -->
    <div id="wheel-game" class="game-screen">
      <button class="btn" onclick="showGame('games-list')">← Назад</button>
      <h2>🎡 Колесо</h2>
      <div class="wheel">
        <div class="wheel-pointer"></div>
        <div class="wheel-label" id="wheel-label">?</div>
      </div>
      <button class="btn" onclick="spinWheel()">Крутить</button>
    </div>
  </div>
  <div class="navbar">
    <button class="active" onclick="showGame('games-list', this)">Играть</button>
    <button onclick="alert('Инвентарь скоро!')">Инвентарь</button>
    <button onclick="alert('Профиль скоро!')">Профиль</button>
    <button onclick="alert('Задания скоро!')">Задания</button>
    <button onclick="alert('Рейтинг скоро!')">Рейтинг</button>
  </div>
  <script>
    // Навигация
    function showGame(id, btn) {
      document.querySelectorAll('.game-screen').forEach(e => e.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      document.querySelectorAll('.navbar button').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    // Мины
    let mines = [], minesOpened = [], minesBomb = 0;
    function startMines() {
      mines = Array(25).fill(0);
      minesOpened = Array(25).fill(false);
      minesBomb = Math.floor(Math.random() * 25);
      mines[minesBomb] = 1;
      renderMines();
      document.getElementById('mines-status').textContent = '';
    }
    function renderMines() {
      let grid = document.getElementById('mines-grid');
      grid.innerHTML = '';
      for (let i = 0; i < 25; i++) {
        let cell = document.createElement('div');
        cell.className = 'mines-cell' + (minesOpened[i] ? (mines[i] ? ' bomb' : ' open') : '');
        cell.textContent = minesOpened[i] ? (mines[i] ? '💣' : '👑') : '';
        cell.onclick = () => {
          if (minesOpened[i]) return;
          minesOpened[i] = true;
          if (mines[i]) {
            document.getElementById('mines-status').textContent = '💥 БУМ! Попался на мину!';
            renderMines();
          } else {
            renderMines();
            if (minesOpened.filter(x=>x).length === 24) {
              document.getElementById('mines-status').textContent = '🎉 Победа!';
            }
          }
        };
        grid.appendChild(cell);
      }
    }
    startMines();

    // Ракета
    let rocketInterval = null, rocketMultiplier = 1, rocketActive = false;
    function startRocket() {
      if (rocketActive) return;
      rocketActive = true;
      rocketMultiplier = 1;
      document.getElementById('rocket-multiplier').textContent = 'x1.00';
      document.getElementById('rocket-cashout').disabled = false;
      rocketInterval = setInterval(() => {
        rocketMultiplier += Math.random() * 0.15 + 0.05;
        document.getElementById('rocket-multiplier').textContent = 'x' + rocketMultiplier.toFixed(2);
        if (Math.random() < 0.03 + rocketMultiplier/100) { // шанс взрыва
          clearInterval(rocketInterval);
          rocketActive = false;
          document.getElementById('rocket-cashout').disabled = true;
          document.getElementById('rocket-multiplier').textContent = '💥 ВЗРЫВ!';
        }
      }, 300);
    }
    function cashoutRocket() {
      if (!rocketActive) return;
      clearInterval(rocketInterval);
      rocketActive = false;
      document.getElementById('rocket-cashout').disabled = true;
      document.getElementById('rocket-multiplier').textContent = '🎉 Вы забрали x' + rocketMultiplier.toFixed(2);
    }

    // Колесо
    const wheelPrizes = [
      {label: '25 🟣', color: '#6a11cb'},
      {label: '14 🟣', color: '#2575fc'},
      {label: '5 🟣', color: '#e74c3c'},
      {label: '10 🟣', color: '#f1c40f'},
      {label: '6 🟣', color: '#2ecc71'},
    ];
    function spinWheel() {
      let idx = Math.floor(Math.random() * wheelPrizes.length);
      let prize = wheelPrizes[idx];
      let label = document.getElementById('wheel-label');
      label.textContent = '...';
      setTimeout(() => {
        label.textContent = prize.label;
      }, 1200);
    }
    document.getElementById('wheel-label').textContent = '?';
  </script>
</body>
</html>
