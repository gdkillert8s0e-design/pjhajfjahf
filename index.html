<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сирис - AI Ассистент</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-container {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            text-align: right;
        }

        .message-content {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .message-header {
            font-size: 11px;
            margin-bottom: 5px;
            opacity: 0.7;
        }

        .input-container {
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        #messageInput:focus {
            border-color: #667eea;
        }

        #sendBtn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        #sendBtn:hover {
            transform: scale(1.05);
        }

        #sendBtn:active {
            transform: scale(0.95);
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: none;
            padding: 10px;
            text-align: left;
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .stats {
            padding: 15px;
            background: #f9f9f9;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            font-size: 12px;
            color: #666;
        }

        .btn-clear {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 5px;
        }

        .btn-clear:hover {
            background: #ff3838;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Сирис</h1>
            <p>AI-ассистент на базе Groq (LLaMA 3.3 70B)</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                <div class="message-header">🤖 Сирис</div>
                <div class="message-content">
                    Привет! 👋 Я Сирис - твой AI-ассистент. Задавай любые вопросы, и я с радостью помогу! 😊
                </div>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
        </div>

        <div class="input-container">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Напишите сообщение..."
                autocomplete="off"
            >
            <button id="sendBtn">Отправить</button>
        </div>

        <div class="stats">
            <div>Сообщений: <strong id="msgCount">1</strong></div>
            <button class="btn-clear" onclick="clearHistory()">Очистить историю</button>
        </div>
    </div>

    <script>
        const GROQ_API_KEY = "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";
        const GROQ_API_URL = "https://api.groq.com/openai/v1/chat/completions";
        const MODEL_NAME = "llama-3.3-70b-versatile";

        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let messages = [
            {
                role: "system",
                content: "Ты умный AI-ассистент по имени Сирис. Отвечай дружелюбно, помогай пользователям и поддерживай разговор. Используй emoji когда это уместно. Отвечай на русском языке."
            }
        ];

        let messageCount = 1;

        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const msgCountEl = document.getElementById('msgCount');

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // Добавляем сообщение пользователя
            addMessage(text, 'user');
            messageInput.value = '';
            sendBtn.disabled = true;

            // Показываем индикатор печати
            typingIndicator.classList.add('active');

            // Добавляем сообщение в историю
            messages.push({
                role: "user",
                content: text
            });

            try {
                // Запрос к Groq API
                const response = await fetch(GROQ_API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${GROQ_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: messages.slice(-11), // последние 10 сообщений + system
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                const aiResponse = data.choices[0].message.content;

                // Добавляем ответ AI
                messages.push({
                    role: "assistant",
                    content: aiResponse
                });

                typingIndicator.classList.remove('active');
                addMessage(aiResponse, 'bot');

            } catch (error) {
                console.error('Error:', error);
                typingIndicator.classList.remove('active');
                addMessage('Извините, произошла ошибка при обработке запроса 😔', 'bot');
            }

            sendBtn.disabled = false;
            messageInput.focus();
        }

        function addMessage(text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const header = document.createElement('div');
            header.className = 'message-header';
            header.textContent = type === 'user' ? '👤 Вы' : '🤖 Сирис';

            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;

            messageDiv.appendChild(header);
            messageDiv.appendChild(content);
            chatContainer.appendChild(messageDiv);

            chatContainer.scrollTop = chatContainer.scrollHeight;

            messageCount++;
            msgCountEl.textContent = messageCount;
        }

        function clearHistory() {
            if (confirm('Очистить всю историю разговора?')) {
                messages = [messages[0]]; // Оставляем только system prompt
                chatContainer.innerHTML = `
                    <div class="message bot">
                        <div class="message-header">🤖 Сирис</div>
                        <div class="message-content">
                            История очищена! Начнём сначала? 😊
                        </div>
                    </div>
                `;
                messageCount = 1;
                msgCountEl.textContent = messageCount;
            }
        }

        // События
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Telegram WebApp кнопка
        tg.MainButton.text = "Отправить";
        tg.MainButton.onClick(() => {
            sendMessage();
        });

        messageInput.addEventListener('input', () => {
            if (messageInput.value.trim()) {
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        });
    </script>
</body>
</html>
